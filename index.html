<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CalmCompanion</title>

  <!-- iOS & Android Fullscreen App Meta Tags -->
  <meta name="theme-color" content="#4a7c59" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CalmCompanion" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Embedded SVG App Icon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234a7c59'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-size='55'>🌿</text></svg>" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234a7c59'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-size='55'>🌿</text></svg>" />

  <!-- Load Google Gen AI SDK -->
  <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.run/@google/genai"
      }
    }
  </script>

  <style>
    :root {
      --bg: #f4f7f6;
      --card: #ffffff;
      --primary: #4a7c59;
      --text: #2c3e50;
      --bot-msg: #e8f0ec;
      --user-msg: #4a7c59;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: var(--bg); color: var(--text); display: flex; justify-content: center; height: 100dvh; overflow: hidden; }
    .app { width: 100%; max-width: 480px; background: var(--card); display: flex; flex-direction: column; height: 100dvh; }
    header { background: var(--primary); color: white; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    header h1 { margin: 0; font-size: 1.1rem; display: flex; align-items: center; gap: 6px; }
    .controls { display: flex; gap: 6px; align-items: center; }
    .action-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }
    #chat { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 82%; padding: 12px 14px; border-radius: 16px; line-height: 1.45; font-size: 0.95rem; word-wrap: break-word; white-space: pre-wrap; }
    .bot { background: var(--bot-msg); align-self: flex-start; border-bottom-left-radius: 4px; }
    .user { background: var(--user-msg); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .quick-moods { display: flex; gap: 8px; padding: 10px 14px; overflow-x: auto; border-top: 1px solid #eee; scrollbar-width: none; }
    .quick-moods::-webkit-scrollbar { display: none; }
    .mood-btn { border: 1px solid #dce4e0; background: #fafafa; padding: 7px 13px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; white-space: nowrap; }
    .mood-btn:active { background: var(--bot-msg); transform: scale(0.97); }
    .input-area { display: flex; padding: 12px; border-top: 1px solid #eee; gap: 8px; background: #fff; }
    input[type="text"] { flex: 1; padding: 12px 15px; border: 1px solid #ccc; border-radius: 24px; outline: none; font-size: 0.95rem; }
    input[type="text"]:focus { border-color: var(--primary); }
    button.send { background: var(--primary); color: white; border: none; padding: 0 20px; border-radius: 24px; cursor: pointer; font-weight: 600; }
    
    /* Modal for API Key */
    #keyModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; padding: 20px; }
    .modal-content { background: white; padding: 20px; border-radius: 12px; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 12px; }
    .modal-content h3 { margin: 0 0 4px 0; font-size: 1.1rem; }
    .modal-content input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; width: 100%; }
    .modal-buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
    .modal-buttons button { padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; }
    .save-key { background: var(--primary); color: white; }
    .cancel-key { background: #eee; color: #333; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🌿 CalmCompanion</h1>
      <div class="controls">
        <button class="action-btn" onclick="openKeyModal()" title="API Key Settings">⚙️ Key</button>
        <button class="action-btn" onclick="clearChat()" title="Reset Chat">↺</button>
      </div>
    </header>

    <div id="chat"></div>

    <div class="quick-moods">
      <button class="mood-btn" onclick="sendQuick('😊 Feeling good')">😊 Good</button>
      <button class="mood-btn" onclick="sendQuick('😔 Feeling low')">😔 Low</button>
      <button class="mood-btn" onclick="sendQuick('😰 Anxious / Stressed')">😰 Anxious</button>
      <button class="mood-btn" onclick="sendQuick('😴 Exhausted')">😴 Tired</button>
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Write what's on your mind..." onkeypress="if(event.key==='Enter') sendMessage()" />
      <button class="send" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <!-- API Key Modal -->
  <div id="keyModal">
    <div class="modal-content">
      <h3>Enter Gemini API Key</h3>
      <p style="font-size:0.85rem; color:#666; margin:0;">Your key is stored securely in your browser's local storage and is only used to talk to Gemini.</p>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy..." />
      <div class="modal-buttons">
        <button class="cancel-key" onclick="closeKeyModal()">Cancel</button>
        <button class="save-key" onclick="saveApiKey()">Save Key</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { GoogleGenAI } from "@google/genai";

    // PWA Manifest setup
    const manifest = {
      name: "CalmCompanion Personal Check-In",
      short_name: "CalmCompanion",
      start_url: ".",
      display: "standalone",
      background_color: "#f4f7f6",
      theme_color: "#4a7c59",
      icons: [{
        src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234a7c59'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-size='55'>🌿</text></svg>",
        sizes: "192x192 512x512",
        type: "image/svg+xml",
        purpose: "any maskable"
      }]
    };
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(link);

    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    const chat = document.getElementById('chat');
    let history = JSON.parse(localStorage.getItem('calm_chat_history') || '[]');
    let chatSession = null;

    function getApiKey() {
      return localStorage.getItem('gemini_api_key') || '';
    }

    async function initGemini() {
      const apiKey = getApiKey();
      if (!apiKey) return;
      try {
        const ai = new GoogleGenAI({ apiKey: apiKey });
        // Format history for SDK chats if available, keeping conversation context
        const formattedHistory = history.map(msg => ({
          role: msg.sender === 'user' ? 'user' : 'model',
          parts: [{ text: msg.text }]
        }));

        chatSession = ai.chats.create({
          model: 'gemini-2.5-flash',
          history: formattedHistory.length > 0 ? formattedHistory : undefined,
          config: {
            systemInstruction: "You are a warm, deeply empathetic, and supportive personal emotional companion. Your job is to listen actively, validate feelings gently, offer supportive coping tips when appropriate, and check in on how the user is doing. Keep your responses concise, conversational, and comforting."
          }
        });
      } catch (e) {
        console.error("Failed to initialize Gemini session", e);
      }
    }

    window.openKeyModal = function() {
      document.getElementById('apiKeyInput').value = getApiKey();
      document.getElementById('keyModal').style.display = 'flex';
    }

    window.closeKeyModal = function() {
      document.getElementById('keyModal').style.display = 'none';
    }

    window.saveApiKey = function() {
      const key = document.getElementById('apiKeyInput').value.trim();
      if (key) {
        localStorage.setItem('gemini_api_key', key);
        closeKeyModal();
        initGemini();
        renderMessage("API Key saved successfully! 🌿 We are connected to Gemini.", "bot");
      }
    }

    function renderMessage(text, sender, save = true) {
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      if (save) {
        history.push({ text, sender });
        localStorage.setItem('calm_chat_history', JSON.stringify(history.slice(-50)));
      }
    }

    window.sendMessage = async function() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const apiKey = getApiKey();
      if (!apiKey) {
        renderMessage(text, 'user');
        input.value = '';
        setTimeout(() => {
          renderMessage("Please click the **⚙️ Key** button in the top right corner to enter your Gemini API key first.", "bot");
          openKeyModal();
        }, 400);
        return;
      }

      if (!chatSession) {
        await initGemini();
      }

      renderMessage(text, 'user');
      input.value = '';

      // Show temporary typing indicator
      const typingDiv = document.createElement('div');
      typingDiv.className = 'msg bot';
      typingDiv.textContent = '...';
      chat.appendChild(typingDiv);
      chat.scrollTop = chat.scrollHeight;

      try {
        const result = await chatSession.sendMessage({ message: text });
        chat.removeChild(typingDiv);
        renderMessage(result.text, 'bot');
      } catch (err) {
        chat.removeChild(typingDiv);
        renderMessage("Sorry, I had trouble connecting to Gemini. Please check if your API key is correct.", "bot");
      }
    }

    window.sendQuick = function(text) {
      document.getElementById('userInput').value = text;
      window.sendMessage();
    }

    window.clearChat = function() {
      localStorage.removeItem('calm_chat_history');
      history = [];
      chat.innerHTML = '';
      chatSession = null;
      initGemini();
      renderMessage("Chat reset 🌿 How are you feeling right now?", "bot");
    }

    // Startup
    if (history.length > 0) {
      history.forEach(item => renderMessage(item.text, item.sender, false));
    } else {
      renderMessage("Hi! I'm your personal emotional support companion powered by Gemini. Click **⚙️ Key** in the top right to add your API key, or just start chatting!", "bot");
    }
    initGemini();
  </script>
</body>
</html>
